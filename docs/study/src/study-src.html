<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portfolio Direction Study</title>
<script src="data/content.js"></script>
<style>
/*__FONTS__*/
/* ───────────────────────── Study chrome (neutral, so it never competes) ───────────────────────── */
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: #E6E4DF; font: 14px/1.45 system-ui, -apple-system, sans-serif; color: #1d1c1a; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
img { max-width: 100%; }

.study-bar { position: sticky; top: 0; z-index: 50; background: #1F1E1C; color: #EDEBE6; padding: 10px 20px; display: flex; flex-direction: column; gap: 8px; }
.sb-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.sb-adj { padding-top: 8px; border-top: 1px solid #34322E; }
.study-bar h1 { margin: 0 8px 0 0; font-size: 14px; font-weight: 650; letter-spacing: .01em; white-space: nowrap; cursor: help; }
.study-bar h1 span { color: #9C978D; font-weight: 500; }
.sb-grp { display: inline-flex; align-items: center; gap: 2px; padding: 3px; border-radius: 10px; background: #2B2926; }
.sb-grp[hidden] { display: none; }
.sb-lab { font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #A09B91; padding: 0 7px 0 8px; white-space: nowrap; cursor: help; }
.sb-grp button { border: 0; background: transparent; color: #CFCBC3; padding: 5px 10px; border-radius: 7px; cursor: pointer; font-size: 13px; font-weight: 550; white-space: nowrap; }
.sb-grp button:hover { color: #fff; background: #3A3834; }
.sb-grp button[aria-pressed="true"] { background: #F4F2ED; color: #1F1E1C; }
.sb-ctx { margin-left: auto; }
.sb-note { font-size: 12.5px; color: #A09B91; margin-left: 4px; }
.study-bar button:focus-visible { outline: 2px solid #F4F2ED; outline-offset: 2px; }
.study-toast { position: fixed; left: 50%; bottom: 24px; translate: -50% 0; z-index: 60; max-width: calc(100vw - 32px); padding: 10px 14px; border-radius: 10px; background: #1F1E1C; color: #EDEBE6; font: 13px/1.4 system-ui, -apple-system, sans-serif; box-shadow: 0 12px 30px -12px rgba(0,0,0,.5); opacity: 0; pointer-events: none; transition: opacity .2s; }
.study-toast.on { opacity: 1; }

.stage { padding: 28px 16px 60px; display: flex; justify-content: center; }
.frame { width: min(1280px, 100%); border-radius: 14px; overflow: clip; box-shadow: 0 30px 70px -40px rgba(0,0,0,.45), 0 0 0 1px rgba(0,0,0,.06); position: relative; }
.frame.is-mobile { width: 390px; max-width: 100%; border-radius: 40px; box-shadow: 0 0 0 10px #1F1E1C, 0 30px 70px -30px rgba(0,0,0,.5); }

/* ───────────────────────── App tokens ───────────────────────── */
.app {
  --paper: oklch(0.974 0.004 85); --paper-2: oklch(0.952 0.005 85); --paper-3: oklch(0.925 0.006 85);
  --ink: oklch(0.2 0.012 262); --ink-2: oklch(0.41 0.012 262); --ink-3: oklch(0.52 0.01 262);
  --line: oklch(0.2 0.012 262 / 0.13); --line-2: oklch(0.2 0.012 262 / 0.26); --axis: oklch(0.2 0.012 262 / 0.075);
  --accent: oklch(0.56 0.19 33); --accent-ink: oklch(0.52 0.18 33); --on-accent: oklch(0.985 0.003 85);
  --band: oklch(0.945 0.006 85); --bg: var(--paper); --hover: color-mix(in oklab, var(--ink) 4%, transparent);
  --grid-gap: 1.5rem; --header-h: 4rem; --gutter: clamp(1.25rem, 4cqi, 3rem);
  --settle: cubic-bezier(0.22, 1, 0.36, 1); --drawing: cubic-bezier(0.65, 0, 0.35, 1);
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "Geist Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  container: app / inline-size; position: relative; min-height: 900px; overflow: clip;
  background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 16px; line-height: 1.6;
  font-optical-sizing: auto; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
}
.app[data-theme="dark"] {
  --paper: oklch(0.175 0.008 262); --paper-2: oklch(0.205 0.009 262); --paper-3: oklch(0.24 0.01 262);
  --ink: oklch(0.95 0.005 85); --ink-2: oklch(0.78 0.008 85); --ink-3: oklch(0.64 0.008 85);
  --line: oklch(0.95 0.005 85 / 0.12); --line-2: oklch(0.95 0.005 85 / 0.24); --axis: oklch(0.95 0.005 85 / 0.06);
  --accent: oklch(0.7 0.17 40); --accent-ink: oklch(0.74 0.15 42); --on-accent: oklch(0.175 0.008 262);
  --band: oklch(0.21 0.009 262);
  color-scheme: dark;
}
/* Base resets at zero specificity, so component classes always win */
:where(.app) *, :where(.app) *::before, :where(.app) *::after { border-color: var(--line); }
:where(.app) a { color: inherit; text-decoration: none; cursor: pointer; }
:where(.app) button { background: none; border: 0; padding: 0; cursor: pointer; }
:where(.app) :where(h1, h2, h3, h4, p, figure, dl, dd, ol, ul) { margin: 0; }
:where(.app) :where(ol, ul) { list-style: none; padding: 0; }
:where(.app) :where(h1, h2, h3) { font-weight: 500; text-wrap: balance; }
:where(.app) p { text-wrap: pretty; }
:where(.app) img { display: block; }
:where(.app) :where(input, select) { font: inherit; color: inherit; }
.app ::selection { background: var(--accent); color: var(--on-accent); }
.app :focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }

/* Fluid type ramp, measured against the frame (container units) */
.display { font-size: clamp(2.75rem, 0.9rem + 6.4cqi, 6.5rem); line-height: .94; letter-spacing: -.048em; }
.title { font-size: clamp(2.5rem, 1.2rem + 4.4cqi, 5.25rem); line-height: .96; letter-spacing: -.045em; }
.heading { font-size: clamp(1.875rem, 1.25rem + 2.1cqi, 3.25rem); line-height: 1.02; letter-spacing: -.04em; }
.subheading { font-size: clamp(1.25rem, 1.05rem + .65cqi, 1.75rem); line-height: 1.15; letter-spacing: -.025em; }
.lead { font-size: clamp(1.125rem, 1rem + .42cqi, 1.375rem); line-height: 1.5; letter-spacing: -.012em; }
/* Long reading paragraphs (role and degree overviews, the About bio): body size, a step up, about 70 characters
   a line (34em; ch is the wide "0", so 58ch came out at ~80). The large .lead size is
   kept for short intros of 2–3 lines. */
.read { font-size: 1.0625rem; line-height: 1.65; letter-spacing: -.005em; max-width: 34em; }
@container app (width >= 48rem) { .read { font-size: 1.125rem; } }
.read + .read { margin-top: 20px; }
.an { font-family: var(--mono); font-size: 11px; line-height: 1.35; letter-spacing: .08em; text-transform: uppercase; }
.small { font-size: .9375rem; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.ink { color: var(--ink); }
.acc { color: var(--accent-ink); }
.num { font-variant-numeric: tabular-nums; }
.ico { width: 16px; height: 16px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: square; }

/* ───────────────────────── Layout: 4 / 8 / 12 column page grid ───────────────────────── */
.wrap { margin-inline: auto; width: 100%; max-width: 90rem; padding-inline: var(--gutter); }
.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); column-gap: var(--grid-gap); }
.col { grid-column: 1 / -1; min-width: 0; }
.b-2 { grid-column: span 2 / span 2; } .b-3 { grid-column: span 3 / span 3; }
@container app (width >= 40rem) { .s-2 { grid-column: span 2 / span 2; } .s-3 { grid-column: span 3 / span 3; } }
@container app (width >= 48rem) {
  .grid { grid-template-columns: repeat(8, minmax(0, 1fr)); }
  .m-2 { grid-column: span 2 / span 2; } .m-3 { grid-column: span 3 / span 3; } .m-4 { grid-column: span 4 / span 4; }
  .m-5 { grid-column: span 5 / span 5; } .m-6 { grid-column: span 6 / span 6; }
  .ms-6 { grid-column-start: 6; }
}
@container app (width >= 64rem) {
  .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
  .l-3 { grid-column: span 3 / span 3; } .l-4 { grid-column: span 4 / span 4; } .l-5 { grid-column: span 5 / span 5; }
  .l-6 { grid-column: span 6 / span 6; } .l-7 { grid-column: span 7 / span 7; } .l-8 { grid-column: span 8 / span 8; } .l-9 { grid-column: span 9 / span 9; }
  .ls-1 { grid-column-start: 1; } .ls-4 { grid-column-start: 4; } .ls-5 { grid-column-start: 5; } .ls-6 { grid-column-start: 6; } .ls-8 { grid-column-start: 8; }
  .ls-9 { grid-column-start: 9; } .ls-10 { grid-column-start: 10; }
  .lr-1 { grid-row-start: 1; }
}

/* ───────────────────────── Drawing conventions (the ones that stay) ───────────────────────── */

/* Framed images; things you can open show printer's crop marks on hover */
.sheet { position: relative; }
.sheet-frame { position: relative; overflow: hidden; background: var(--paper-2); box-shadow: 0 0 0 1px var(--line); aspect-ratio: 16 / 9; }
.sheet-frame img { width: 100%; height: 100%; object-fit: cover; object-position: top; transition: scale 1s var(--settle); }
.crop { position: absolute; width: 18px; height: 18px; pointer-events: none; color: var(--accent); opacity: 0; transition: opacity .35s ease, translate .6s var(--settle); }
.crop::before, .crop::after { content: ""; position: absolute; background: currentColor; }
.crop::before { width: 10px; height: 1px; } .crop::after { width: 1px; height: 10px; }
.crop.tl { top: -18px; left: -18px; } .crop.tl::before { bottom: 0; left: 0; } .crop.tl::after { top: 0; right: 0; }
.crop.tr { top: -18px; right: -18px; } .crop.tr::before { bottom: 0; right: 0; } .crop.tr::after { top: 0; left: 0; }
.crop.bl { bottom: -18px; left: -18px; } .crop.bl::before { top: 0; left: 0; } .crop.bl::after { bottom: 0; right: 0; }
.crop.br { bottom: -18px; right: -18px; } .crop.br::before { top: 0; right: 0; } .crop.br::after { bottom: 0; left: 0; }
.group:hover .crop, .group:focus-within .crop { opacity: 1; }
.group:hover .crop.tl { translate: 4px 4px; } .group:hover .crop.tr { translate: -4px 4px; } .group:hover .crop.bl { translate: 4px -4px; } .group:hover .crop.br { translate: -4px -4px; }
.group:hover .sheet-frame img { scale: 1.015; }

/* Dimension strings measure spans of time: hairline, oblique ticks, an arrow while still running */
.dim { position: relative; height: 20px; }
.dim-line { position: absolute; left: 0; right: 0; top: 50%; height: 1px; background: currentColor; }
.dim-tick { position: absolute; top: 50%; width: 1px; height: 11px; background: currentColor; translate: -50% -50%; rotate: 45deg; }
.dim-ext { position: absolute; top: 50%; width: 1px; height: 17px; background: currentColor; opacity: .45; translate: -50% -50%; }
.dim-arrow { position: absolute; top: 50%; left: 100%; width: 8px; height: 8px; translate: -100% -50%; overflow: visible; }
.dim-label { position: absolute; bottom: calc(50% + 5px); left: 50%; translate: -50% 0; white-space: nowrap; font-family: var(--mono); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }

/* Hatching marks what isn't built yet */
.hatch { background-image: repeating-linear-gradient(-45deg, var(--line-2) 0 1px, transparent 1px 7px); }

/* Links */
.lk { background-image: linear-gradient(currentColor, currentColor), linear-gradient(var(--line-2), var(--line-2)); background-position: 0 100%, 0 100%; background-repeat: no-repeat; background-size: 0% 1px, 100% 1px; padding-bottom: .125em; transition: background-size .5s var(--settle), color .3s; }
.lk:hover { background-size: 100% 1px, 100% 1px; color: var(--accent-ink); }
.ld { background-image: linear-gradient(currentColor, currentColor); background-position: 0 100%; background-repeat: no-repeat; background-size: 0% 1px; transition: background-size .5s var(--settle), color .3s; }
.ld:hover { background-size: 100% 1px; }
.tl-link { display: inline-flex; align-items: center; gap: 6px; font-weight: 500; }
.tl-link .ico { width: 14px; height: 14px; }
/* Arrow hover: each arrow nudges the way it points (units are the icon's 24-unit box: 3 = 2px at 16px) */
.ico .mv { transition: translate .35s var(--settle); }
:is(a, button, .entry):hover .ico.i-right .mv { translate: 3px 0; }
:is(a, button, .entry):hover .ico.i-left .mv { translate: -3px 0; }
:is(a, button, .entry):hover .ico.i-down .mv { translate: 0 3px; }
:is(a, button, .entry):hover .ico.i-up .mv { translate: 0 -3px; }
:is(a, button, .entry):hover .ico.i-out .mv { translate: 2.5px -2.5px; }
:is(a, button, .entry):hover .ico.i-dl .mv { translate: 0 2.5px; }

/* Buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; min-height: 48px; max-width: 100%; padding: 12px 20px; font-size: 15px; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; text-align: left; background: var(--ink); color: var(--paper); transition: background-color .3s, color .3s, box-shadow .3s; }
.btn:hover { background: var(--accent); color: var(--on-accent); }
.btn.outline { background: transparent; color: var(--ink); box-shadow: inset 0 0 0 1px var(--line-2); }
.btn.outline:hover { box-shadow: inset 0 0 0 1px var(--ink); background: transparent; color: var(--ink); }
.btn.sm { min-height: 36px; padding: 8px 14px; font-size: 14px; gap: 8px; }
.btns { display: flex; flex-wrap: wrap; gap: 12px; }
.chip { display: inline-flex; align-items: center; height: 28px; padding: 0 10px; font-size: .8125rem; box-shadow: inset 0 0 0 1px var(--line-2); color: var(--ink-2); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }

/* ───────────────────────── Header ───────────────────────── */
.hdr { position: sticky; top: var(--sb-h, 0px); z-index: 20; border-bottom: 1px solid var(--line); background: color-mix(in oklab, var(--paper) 82%, transparent); backdrop-filter: blur(12px) saturate(1.5); }
.hdr-in { display: flex; align-items: center; gap: 24px; height: var(--header-h); }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-name { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
.mono-mark { width: 32px; height: 32px; flex: none; overflow: visible; }
.mono-mark circle { fill: transparent; stroke: currentColor; transition: fill .5s, stroke .5s; }
.mono-mark g { stroke: currentColor; transition: stroke .5s; }
.brand:hover .mono-mark circle { fill: var(--accent); stroke: var(--accent); }
.brand:hover .mono-mark g { stroke: var(--on-accent); }
.nav { margin-left: auto; display: none; gap: 32px; }
@container app (width >= 48rem) { .nav { display: flex; } }
.nav a { position: relative; display: flex; align-items: center; height: var(--header-h); font-size: 15px; color: var(--ink-2); transition: color .3s; }
.nav a:hover, .nav a.on { color: var(--ink); }
.nav a::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 1px; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .5s var(--settle); }
.nav a:hover::after, .nav a.on::after { transform: scaleX(1); }
.hdr-tools { margin-left: auto; display: flex; align-items: center; gap: 4px; }
@container app (width >= 48rem) { .hdr-tools { margin-left: 8px; } }
.lang { display: none; align-items: center; }
@container app (width >= 40rem) { .lang { display: flex; } }
.lang button { height: 36px; min-width: 32px; padding: 0 4px; color: var(--ink-3); }
.lang button.on, .lang button:hover { color: var(--ink); }
.lang .sl { color: color-mix(in oklab, var(--ink-3) 50%, transparent); }
.icon-btn { width: 36px; height: 36px; display: grid; place-items: center; color: var(--ink-2); }
.icon-btn:hover { color: var(--ink); }
.icon-btn .ico { width: 18px; height: 18px; }
.hdr-contact { display: none !important; margin-left: 12px; }
@container app (width >= 64rem) { .hdr-contact { display: inline-flex !important; } }
.menu-btn { display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 8px; margin-left: 4px; }
@container app (width >= 48rem) { .menu-btn { display: none; } }

/* Phone menu (drawn inside the frame) */
.menu { position: absolute; inset: 0; z-index: 40; background: var(--paper); overflow: auto; }
.menu-top { display: flex; align-items: center; justify-content: space-between; height: var(--header-h); border-bottom: 1px solid var(--line); }
.menu-list { border-top: 1px solid var(--line); margin-top: 32px; }
.menu-list li { border-bottom: 1px solid var(--line); }
.menu-list a { display: block; padding: 20px 0; }
.menu-list a.on { color: var(--accent-ink); }

/* ───────────────────────── Sections ───────────────────────── */
main.page { position: relative; z-index: 1; }
/* Bands: every top-level section is a full-width band and the tone alternates (paper, then a deeper paper),
   so each section reads as its own area. The footer closes the page in graphite. */
.band { position: relative; background: var(--bg); padding-block: 72px; scroll-margin-top: calc(var(--sb-h, 0px) + var(--header-h)); }
@container app (width >= 48rem) { .band { padding-block: 96px; } }
@container app (width >= 64rem) { .band { padding-block: 112px; } }
.band:nth-child(even) { --bg: var(--band); }
.band:first-child { padding-top: 0; }
.band > .wrap:first-child > :first-child { margin-top: 0; }
/* Inside a band, a section opens with its heading (an optional eyebrow and intro) and an optional action on the right */
.sec-head { display: grid; row-gap: 16px; }
.sec-title h2 { max-width: 22ch; }
.sec-eyebrow { margin-bottom: 16px; color: var(--ink-3); }
.sec-intro { margin-top: 20px; max-width: 50ch; color: var(--ink-2); }
.sec-action { justify-self: start; }
@container app (width >= 48rem) {
  .sec-head { grid-template-columns: minmax(0, 1fr) auto; column-gap: var(--grid-gap); align-items: end; }
  .sec-action { justify-self: end; padding-bottom: 8px; }
}
.sec-body { margin-top: 48px; }
@container app (width >= 48rem) { .sec-body { margin-top: 64px; } }

/* The parts of a project or record page share one band: an ink rule between parts, the part's name on the rail,
   content from column 4 */
.part { margin-top: 80px; row-gap: 24px; border-top: 1px solid var(--ink); padding-top: 20px; }
@container app (width >= 48rem) { .part { margin-top: 96px; } }
.band > .wrap:first-child > .part { border-top: 0; padding-top: 0; }
.rail-label { padding-top: 6px; color: var(--ink); font-weight: 400; }
.part .cards { margin-top: 0; }

.page-head { padding-top: 56px; }
@container app (width >= 48rem) { .page-head { padding-top: 72px; } }
@container app (width >= 64rem) { .page-head { padding-top: 80px; } }
.page-head .eyebrow { color: var(--ink-3); }
.page-head h1 { margin-top: 24px; max-width: 18ch; }
.page-head .intro { margin-top: 28px; max-width: 52ch; color: var(--ink-2); }

.crumb { display: flex; align-items: center; gap: 8px; color: var(--ink-3); padding-top: 56px; }
@container app (width >= 48rem) { .crumb { padding-top: 72px; } }
@container app (width >= 64rem) { .crumb { padding-top: 80px; } }
.crumb a:hover { color: var(--ink); }
.crumb .here { color: var(--ink); }

/* Spec lists: labelled facts under one rule, like a title block */
.specs { display: grid; column-gap: 24px; border-top: 1px solid var(--line); padding-top: 8px; }
.specs > div { padding: 6px 0 14px; }
.specs dt { color: var(--ink-3); }
.specs dd { margin-top: 6px; font-size: .9375rem; line-height: 1.35; }

.stack { display: flex; flex-wrap: wrap; gap: 2px 8px; font-size: .8125rem; line-height: 1.5; color: var(--ink-3); }
.stack li { display: flex; align-items: center; gap: 8px; }
.stack li + li::before { content: ""; width: 3px; height: 3px; background: var(--line-2); }

.status { display: inline-flex; align-items: center; gap: 8px; color: var(--ink-2); }
.status.running { color: var(--accent-ink); }
.status svg, .glyph { width: 10px; height: 10px; flex: none; overflow: visible; }

/* ───────────────────────── Home ───────────────────────── */
.band.hero { padding-top: 56px; }
@container app (width >= 48rem) { .band.hero { padding-top: 72px; } }
@container app (width >= 64rem) { .band.hero { padding-top: 80px; } }
.hero-grid { row-gap: 48px; position: relative; z-index: 1; }
/* Headline, intro and buttons stay together as one group, centred against the portrait */
.hero-text { display: flex; flex-direction: column; justify-content: center; gap: 32px; }
.hero-title { font-size: clamp(2.5rem, 1.1rem + 4.6cqi, 5.25rem); line-height: 1; letter-spacing: -.045em; }
.hero-lead .lead { max-width: 46ch; }
.hero-portrait .portrait { aspect-ratio: 4 / 5; }
.rise-mask { display: block; overflow: clip; padding-bottom: .12em; margin-bottom: -.12em; }
.rise { display: block; }
.hero-lead .btns { margin-top: 32px; }
.portrait { position: relative; overflow: hidden; background: var(--paper-2); box-shadow: 0 0 0 1px var(--line); aspect-ratio: 4 / 3; }
@container app (width >= 40rem) { .portrait { aspect-ratio: 4 / 5; } }
.portrait img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 38%; }


.meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 12px; color: var(--ink-3); }

.exp-list { border-top: 1px solid var(--line); }
.exp-row { position: relative; align-items: center; row-gap: 16px; padding: 24px 0; border-bottom: 1px solid var(--line); transition: background-color .3s; }
.exp-row:hover { background: var(--hover); }
.exp-row:hover h3 { color: var(--accent-ink); }
@container app (width >= 48rem) { .exp-row { padding: 0; } }
.exp-when { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
@container app (width >= 48rem) { .exp-when { display: block; padding: 28px 0; } .exp-when .faint { margin-top: 6px; } .exp-role { padding: 28px 0; } }
.exp-role h3 { transition: color .3s; }
.exp-role p { margin-top: 4px; color: var(--ink-2); }

/* How I work (About): four columns (2 on tablets, 1 on phones) with thin vertical lines between them and no

.principles { display: grid; row-gap: 40px; }

@container app (width >= 64rem) { .principle:nth-child(odd) { padding-left: 24px; } .principle:nth-child(n + 2) { border-left: 1px solid var(--line); } .principle:first-child { padding-left: var(--row-pad); } }

/* Contact: the address large, the other ways to reach me in one line */

.copy-btn { display: inline-flex; align-items: center; gap: 8px; height: 36px; padding: 0 12px; font-size: .8125rem; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); }

/* ───────────────────────── Footer ───────────────────────── */
.foot { position: relative; z-index: 1;

  --ink: oklch(0.95 0.005 85); --ink-2: oklch(0.78 0.008 85); --ink-3: oklch(0.64 0.008 85);
  --line: oklch(0.95 0.005 85 / 0.12); --line-2: oklch(0.95 0.005 85 / 0.24);
  --accent: oklch(0.7 0.17 40); --accent-ink: oklch(0.74 0.15 42); --on-accent: oklch(0.175 0.008 262);
  --bg: var(--paper); background: var(--bg); color: var(--ink); color-scheme: dark; }

.foot-top { row-gap: 48px; padding: 64px 0; }

/* ───────────────────────── Projects ───────────────────────── */
.ptabs-row { display: flex; flex-direction: column; gap: 16px; margin-top: 56px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
@container app (width >= 48rem) { .ptabs-row { flex-direction: row; align-items: flex-end; justify-content: space-between; margin-top: 80px; } }
.tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; margin-inline: -12px; }
.tabs button { position: relative; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; flex: none; font-size: .9375rem; color: var(--ink-3); transition: color .3s; }
.tabs button:hover, .tabs button.on { color: var(--ink); }

.tabs button::after { content: ""; position: absolute; left: 12px; right: 12px; bottom: 0; height: 1px; background: var(--ink); transform: scaleX(0); transform-origin: left; transition: transform .5s var(--settle); }
.tabs button.on::after { transform: scaleX(1); }

.cards { margin-top: 48px; display: grid; gap: 64px 24px; }

@container app (width >= 64rem) { .cards.three { grid-template-columns: repeat(3, 1fr); } }
.card { position: relative; }
.card-meta { margin-top: 20px; }

.card .sub { margin-top: 6px; color: var(--ink-2); }
.placeholder { width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 24px; color: var(--ink-3); text-align: center; }

.placeholder .an { background: var(--paper-2); padding: 2px 8px; }

/* ───────────────────────── Project page ───────────────────────── */
.p-title { margin-top: 24px; row-gap: 32px; }
.p-title .sub { margin-top: 20px; color: var(--ink-2); }
.p-actions { display: flex; flex-wrap: wrap; gap: 12px; }
@container app (width >= 48rem) { .p-actions { justify-content: flex-end; align-self: end; } }
.p-specs { margin-top: 48px; grid-template-columns: 1fr 1fr; }
@container app (width >= 48rem) { .p-specs { margin-top: 64px; grid-template-columns: repeat(4, 1fr); } }
.p-hero { margin-top: 40px; }
@container app (width >= 48rem) { .p-hero { margin-top: 56px; } }
.p-brief .lead { max-width: 52ch; }
.p-brief .lead + .lead { margin-top: 20px; }
.b-stack { margin-top: 40px; display: flex; flex-wrap: wrap; align-items: center; gap: 12px 20px; }
.r-org { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 24px; }
.r-org .tl-link { font-weight: inherit; }
.r-org .r-doc { font-size: .9375rem; color: var(--ink-2); }
.r-org a { transition: color .3s; } .r-org a:hover { color: var(--accent-ink); }
.part p + p { margin-top: 16px; }
.figs { display: grid; gap: 32px; }
/* Previous / Next: a band of its own with no padding; each link fills its half edge to edge, so the whole half is
   the link (no hover plate: a half-band tint reads as another band; the title turns red and the arrow nudges). No rules above or below (the bands mark the edges); one divider between the two.
   Text lines up with the content edges: --side is the .wrap's outer margin plus its gutter. */
.pager-band { padding-block: 0; }
.pager { display: grid; --side: calc(max(0px, (100cqi - 90rem) / 2) + var(--gutter)); }
.pager a { display: flex; flex-direction: column; gap: 12px; padding: 40px calc(var(--side) + var(--row-pad)); }
.pager a.end { border-top: 1px solid var(--line); }
.pager a:hover .heading { color: var(--accent-ink); }
.pager .an { display: flex; align-items: center; gap: 8px; color: var(--ink-3); }
.pager .heading { transition: color .3s; }
.pager .sub { color: var(--ink-2); }
@container app (width >= 48rem) {
  .pager { grid-template-columns: 1fr 1fr; }
  .pager a { padding: 56px 32px 56px calc(var(--side) + var(--row-pad)); }
  .pager a.end { align-items: flex-end; text-align: right; border-top: 0; border-left: 1px solid var(--line); padding: 56px calc(var(--side) + var(--row-pad)) 56px 32px; }
}

/* ───────────────────────── Timeline ───────────────────────── */
.chart-fig { margin-top: 64px; }
@container app (width >= 48rem) { .chart-fig { margin-top: 80px; } }
.chart-scroll { overflow-x: auto; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); padding-top: 8px; scrollbar-width: thin; }
.chart { min-width: 42rem; --label-w: 8.5rem; }
@container app (width >= 48rem) { .chart { --label-w: 13rem; } }
@container app (width >= 64rem) { .chart { --label-w: 16rem; } }
.crow { display: grid; grid-template-columns: var(--label-w) 1fr; }
.crow > .lab { display: flex; min-width: 0; align-items: center; gap: 12px; padding-right: 16px; }
.crow > .area { position: relative; }
.lab-t { display: block; font-size: 14px; line-height: 1.2; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-m { display: none; margin-top: 2px; color: var(--ink-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.lab-t .wide { display: none; }
@container app (width >= 48rem) { .lab-m { display: block; } .lab-t .wide { display: inline; } .lab-t .narrow { display: none; } }
.lab-w { display: flex; flex-direction: column; min-width: 0; }
.cbody { position: relative; }
.cover { position: absolute; top: 0; bottom: 0; right: 0; left: var(--label-w); pointer-events: none; }
.guide { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--line); }
.guide.tr { background: none; border-left: 1px dashed color-mix(in oklab, var(--accent) 70%, transparent); }
.guide.today { background: var(--ink); }
.brk { position: absolute; top: 0; bottom: 0; background: var(--bg); z-index: 2; }
.brk svg { position: absolute; top: 0; bottom: 0; width: 12px; height: 100%; color: var(--ink-3); }
.brk svg.l { left: -6px; } .brk svg.r { right: -6px; }
.rrow { position: relative; display: block; border-top: 1px solid var(--line); transition: background-color .3s; }
.rrow:hover { background: var(--hover); }
.rrow .area { height: 48px; }
.cbar { position: absolute; top: 50%; height: 10px; translate: 0 -50%; color: var(--ink-2); background: currentColor; transform-origin: left; transition: color .3s, scale 1.2s var(--drawing); }
.cbar.edu { background: var(--bg); box-shadow: inset 0 0 0 1px currentColor; }   /* studies: outlined; hatching stays for "not built yet" */
.cbar.run, .rrow:hover .cbar { color: var(--accent); }
.rrow:hover .glyph { color: var(--accent); }
.mk { position: absolute; z-index: 3; margin-left: -8px; width: 16px; height: 16px; display: grid; place-items: center; color: var(--ink-2); transition: color .3s; }
.mk:hover { color: var(--accent); }
.mk .tip { position: absolute; bottom: calc(100% + 10px); left: 50%; translate: -50% 4px; opacity: 0; pointer-events: none; white-space: nowrap; background: var(--ink); color: var(--paper); padding: 4px 8px; transition: opacity .2s, translate .3s var(--settle); }
.mk:hover .tip { opacity: 1; translate: -50% 0; }
.era { position: absolute; top: 20px; }
.ticks { height: 64px; }
.ticks .an { position: absolute; top: 12px; translate: -50% 0; color: var(--ink-3); white-space: nowrap; }
.ticks .an.first { translate: 0 0; }
.ticks .an.low { top: 36px; }
.legend { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 32px; margin-top: 32px; color: var(--ink-3); }
.legend ul { display: flex; flex-wrap: wrap; gap: 8px 20px; }
.legend li { display: flex; align-items: center; gap: 8px; }
.legend svg, .legend .sw { width: 10px; height: 10px; flex: none; overflow: visible; color: var(--ink-2); }
.legend .sw { display: inline-block; width: 18px; height: 8px; background: currentColor; }
.legend .sw.edu { background: var(--bg); box-shadow: inset 0 0 0 1px currentColor; }

.fbar { position: sticky; top: calc(var(--sb-h, 0px) + var(--header-h)); z-index: 15; margin-inline: calc(-1 * var(--gutter)); padding-inline: var(--gutter); background: color-mix(in oklab, var(--bg) 90%, transparent); backdrop-filter: blur(12px); border-bottom: 1px solid var(--line); }
.fbar-row { display: flex; flex-direction: column; gap: 12px; padding: 12px 0; }
@container app (width >= 64rem) { .fbar-row { flex-direction: row; align-items: center; justify-content: space-between; } }
.ftools { display: flex; align-items: center; gap: 8px; }
.search { position: relative; display: flex; flex: 1; align-items: center; gap: 8px; height: 40px; padding: 0 12px; min-width: 0; box-shadow: inset 0 0 0 1px var(--line-2); }
.search:focus-within { box-shadow: inset 0 0 0 1px var(--ink); }
@container app (width >= 64rem) { .search { flex: none; width: 18rem; } }
.search input { flex: 1; min-width: 0; border: 0; outline: none; background: transparent; font-size: .875rem; }
.search input::placeholder { color: var(--ink-3); }
.search kbd { font-family: var(--mono); font-size: 11px; color: var(--ink-3); padding: 0 6px; box-shadow: inset 0 0 0 1px var(--line-2); }
.tool-btn { display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; font-size: .875rem; flex: none; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); transition: color .3s, box-shadow .3s; }
.tool-btn:hover, .tool-btn.on { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.tool-btn .cnt { display: grid; place-items: center; width: 16px; height: 16px; background: var(--accent); color: var(--on-accent); font-size: 10px; }
/* Filters modal: centred on desktop, a bottom sheet on phones (sized to the study's frame) */
.fmodal { width: min(40rem, calc(var(--app-w, 100vw) - 32px)); max-width: none; max-height: min(80vh, 44rem); padding: 0; border: 0; overflow: hidden; background: var(--paper); color: var(--ink); box-shadow: 0 0 0 1px var(--line-2), 0 32px 80px -32px rgb(0 0 0 / .5); }
.fmodal[open] { display: flex; flex-direction: column; animation: fmodal-in .3s var(--settle); }
.fmodal::backdrop { background: rgb(12 12 16 / .45); }
@keyframes fmodal-in { from { opacity: 0; translate: 0 12px; } }
.fmodal-head { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 12px 12px 24px; border-bottom: 1px solid var(--line); }
.fmodal-body { flex: 1; min-height: 0; overflow: auto; display: grid; align-content: start; gap: 16px; padding: 8px 24px 24px; }
.fmodal-body .fgroup:first-child { border-top: 0; }
.fmodal-head h2:focus { outline: none; }
.fmodal-foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 12px 12px 12px 24px; border-top: 1px solid var(--line); }
.fclear { font-size: .875rem; color: var(--ink-2); } .fclear:hover { color: var(--ink); } .fclear:disabled { opacity: .4; cursor: default; }
@container app (width < 40rem) { .fmodal { width: var(--app-w, 100vw); margin: auto auto 0; max-height: 85vh; } }
.fgroup { display: grid; gap: 8px; border-top: 1px solid var(--line); padding-top: 16px; }
.fgroup .an { color: var(--ink-3); }
/* Checklist: equal columns (2, 3 from 40rem); the plate hangs 8px so boxes align with the group label */
.fopts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 0 8px; margin-inline: -8px; }
@container app (width >= 40rem) { .fopts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.fopt { display: flex; align-items: center; gap: 10px; min-height: 36px; padding: 6px 8px; font-size: .875rem; line-height: 1.3; text-align: left; color: var(--ink-2); transition: background-color .2s, color .2s; }
.fopt:not(:disabled):hover { background: var(--hover); color: var(--ink); }
.fopt:disabled { opacity: .35; cursor: default; }
.fbox { flex: none; width: 16px; height: 16px; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--ink-3); transition: background-color .2s, box-shadow .2s; }
.fbox .ico { width: 12px; height: 12px; stroke: var(--paper); stroke-width: 2.5; opacity: 0; transition: opacity .2s; }
.fopt:not(:disabled):hover .fbox { box-shadow: inset 0 0 0 1px var(--ink); }

.fopts.one { grid-template-columns: minmax(0, 1fr); }
.fopts.one .fopt { align-items: flex-start; } .fopts.one .fbox { margin-top: 1px; }
.fhint { display: block; margin-top: 2px; font-size: .8125rem; color: var(--ink-3); }
/* Stack: one section with four sub-lists; sub-labels are quieter than the section labels */
.fsub { display: grid; gap: 4px; }
.fsub + .fsub { margin-top: 12px; }
.fsub-l { font-size: .8125rem; font-weight: 500; color: var(--ink-2); }
.fopt.on .fbox { background: var(--ink); box-shadow: none; }

.tgrid { display: grid; grid-template-columns: 1.25rem minmax(0, 1fr); column-gap: 16px; }
@container app (width >= 64rem) { .tgrid { grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: var(--grid-gap); } }
/* Years sit 24px under the previous year's last entry (the first one keeps 64 under the toolbar). The spine runs
   on through each year down to its marker, so the timeline is one continuous line. */
.level { align-items: end; padding-top: 24px; }
li:first-child > .level { padding-top: 64px; }
.level h2 { grid-column: 2 / -1; grid-row: 1; padding-left: var(--row-pad); }
.l-spine { grid-column: 1; grid-row: 1 / span 2; position: relative; align-self: stretch; margin-top: -24px; translate: var(--row-pad) 0; }
.l-spine::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; translate: -50% 0; background: var(--line-2); }
.level .datum { grid-column: 1 / -1; grid-row: 2; position: relative; display: flex; justify-content: flex-end; margin-top: 16px; padding-bottom: 8px; border-bottom: 1px solid var(--ink); color: var(--ink-3); }
.level .datum svg { position: absolute; bottom: 0; left: 10px; width: 14px; height: 10px; translate: -50% 0; overflow: visible; color: var(--ink); }
@container app (width >= 64rem) {
  .level h2 { grid-column: 1 / span 2; padding-left: 0; }
  .l-spine { grid-column: 3 / span 1; grid-row: 1; translate: none; }
  .level .datum { grid-column: 3 / span 10; grid-row: 1; margin-top: 0; }
  .level .datum svg { left: calc((100% - 9 * var(--grid-gap)) / 20); }
}
.entry { position: relative; transition: background-color .3s; }
.entry:hover { background: var(--hover); }
.e-spine { grid-column: 1; grid-row: 1 / span 3; position: relative; display: flex; justify-content: center; }
.e-spine::before { content: ""; position: absolute; top: 0; bottom: 0; left: 50%; width: 1px; translate: -50% 0; background: var(--line-2); }
.e-spine .gl { position: relative; margin-top: 28px; width: 20px; height: 20px; display: grid; place-items: center; background: var(--bg); transition: background-color .3s; }
.entry:hover .e-spine .gl { background: color-mix(in oklab, var(--ink) 4%, var(--bg)); }
.entry:hover .e-spine .glyph { color: var(--accent); }
.e-date { grid-column: 2; grid-row: 1; padding-top: 28px; color: var(--ink-2); }
.e-date .d { color: var(--ink-3); margin-left: 12px; }
/* A range stays on one line when it fits ("Mar 2024 – Feb 2025"); if not, it breaks only after the dash */
.e-date .nw { white-space: nowrap; }
.e-body { grid-column: 2; grid-row: 2; padding-top: 12px; }
.e-body h3 a { transition: color .3s; }
.e-body h3 a::after { content: ""; position: absolute; inset: 0; }
.entry:hover .e-body h3 a { color: var(--accent-ink); }
.e-body .org { margin-top: 4px; color: var(--ink-2); }
.e-body .sum { margin-top: 12px; color: var(--ink-2); font-size: .9375rem; max-width: 62ch; }
.e-body .stack { margin-top: 16px; }
.e-meta { grid-column: 2; grid-row: 3; display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding: 12px 0 32px; color: var(--ink-3); }
.e-meta .ico { display: none; }
@container app (width >= 64rem) {
  .e-spine { grid-column: 3 / span 1; grid-row: 1; }
  .e-spine .gl { margin-top: 30px; }
  .e-date { grid-column: 1 / span 2; padding-top: 32px; }
  .e-date .d { display: block; }
  .e-date .d { margin: 4px 0 0; }
  .e-body { grid-column: 4 / span 7; grid-row: 1; padding: 28px 0 32px; }
  .e-meta { grid-column: 11 / span 2; grid-row: 1; flex-direction: column; align-items: flex-end; padding-top: 32px; }
  .e-meta .ico { display: block; margin-top: auto; transition: color .3s; }
  .entry:hover .e-meta .ico { color: var(--accent-ink); }
}
.empty { margin-top: 48px; min-height: 240px; display: grid; place-items: center; padding: 32px; text-align: center; }
.empty p { background: var(--bg); color: var(--ink-2); padding: 8px 16px; max-width: 40ch; }

/* ───────────────────────── Records ───────────────────────── */
.r-title { margin-top: 24px; row-gap: 40px; }
.r-title .sub { margin-top: 20px; color: var(--ink-2); }
.dur .an { color: var(--ink-3); }
.dur .dim { margin-top: 32px; }
.dur .ends { display: flex; justify-content: space-between; gap: 16px; margin-top: 12px; color: var(--ink-2); }
.block p { max-width: 62ch; }
.block p.read { max-width: 34em; }
/* Scope: no rules; four points in two columns at a larger size (wider column, like the stack row), so the section
   has some weight without boxes. Bullets hang in the margin on desktop so the text lines up with the overview. */
.hl { display: grid; gap: 20px 48px; }
@container app (width >= 48rem) { .hl { grid-template-columns: 1fr 1fr; } }
.hl li { position: relative; padding-left: 22px; font-size: 1.0625rem; line-height: 1.45; color: var(--ink); max-width: 40ch; }
.hl li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; background: var(--ink-2); }
@container app (width >= 64rem) { .hl li { padding-left: 0; } .hl li::before { left: -22px; } }
/* Scope: a short title and a sentence per point, two columns (the layout Products had), no bullets or rules */
.scope { display: grid; gap: 32px 48px; }
@container app (width >= 48rem) { .scope { grid-template-columns: 1fr 1fr; } }
.scope p { margin-top: 8px; color: var(--ink-2); max-width: 40em; }
/* Products / Highlights (role and degree pages): no box or rules; one column, one product under another, at
   reading width (Scope keeps the two columns). Linked items: the name carries ↗ or ↓; hover turns it red. */
.prods { display: grid; gap: 32px; max-width: 34em; }
.prods li > a { display: block; }
.prods h3 { display: inline-flex; align-items: baseline; gap: 8px; transition: color .3s; }
.prods h3 .ico { width: 14px; height: 14px; color: var(--ink-3); }
.prods a:hover h3 { color: var(--accent-ink); }
.prods p { margin-top: 8px; color: var(--ink-2); max-width: 40em; }
.prods .stack { margin-top: 12px; }
.show { border-top: 1px solid var(--line); }
.show li { border-bottom: 1px solid var(--line); }
.show .in { display: block; padding: 24px 0; transition: background-color .3s; }
.show a.in:hover { background: var(--hover); }
.show a.in:hover h3 { color: var(--accent-ink); }
.show .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.show .top .ico { color: var(--ink-3); }
.show p { margin-top: 8px; color: var(--ink-2); }
.show .stack { margin-top: 16px; }

/* ───────────────────────── About ───────────────────────── */
.a-intro { margin-top: 64px; row-gap: 48px; }
@container app (width >= 48rem) { .a-intro { margin-top: 96px; } }
.a-intro .portrait { aspect-ratio: 4 / 5; }
.bio p + p { margin-top: 24px; }
.bio .specs { grid-template-columns: 1fr 1fr; margin-top: 48px; }
.story { border-bottom: 1px solid var(--line); }
.story li { row-gap: 16px; border-top: 1px solid var(--line); padding: 40px 0; }
.story .an { color: var(--ink-3); }
.story p { color: var(--ink-2); }
.story .rel { display: flex; flex-wrap: wrap; gap: 8px 20px; margin-top: 16px; }
.story .rel a { font-size: .875rem; }
/* Stack: the main eight as a ruled panel of compact cells, then a row of smaller chips */
.stack-panel { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 1px; background: var(--line); box-shadow: 0 0 0 1px var(--line); }
@container app (width >= 48rem) { .stack-panel { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
.stack-cell { display: flex; align-items: center; gap: 16px; min-width: 0; padding: 20px var(--row-pad); background: var(--bg); transition: background-color .3s; }
.stack-cell:hover { background: color-mix(in oklab, var(--ink) 4%, var(--bg)); }
.stack-ico { width: 40px; height: 40px; flex: none; display: grid; place-items: center; box-shadow: inset 0 0 0 1px var(--line-2); transition: box-shadow .3s; }
.stack-ico svg { width: 20px; height: 20px; fill: currentColor; color: var(--ink); transition: color .3s; }
.stack-cell:hover .stack-ico { box-shadow: inset 0 0 0 1px var(--ink); }
.stack-cell:hover .stack-ico svg, .stack-chip:hover svg { color: var(--brand, var(--ink)); }
.stack-cell .name { min-width: 0; font-size: 1rem; font-weight: 500; line-height: 1.3; letter-spacing: -.01em; }
.stack-also { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; margin-top: 24px; }
.stack-also .an { color: var(--ink-3); }
.stack-also ul { display: flex; flex-wrap: wrap; gap: 8px; }
.stack-chip { display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px; font-size: .875rem; color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--line-2); transition: color .3s, box-shadow .3s; }
.stack-chip svg { width: 14px; height: 14px; flex: none; fill: currentColor; transition: color .3s; }
.stack-chip:hover { color: var(--ink); box-shadow: inset 0 0 0 1px var(--ink); }
.learn { border-bottom: 1px solid var(--line); }
.learn a { align-items: baseline; row-gap: 8px; border-top: 1px solid var(--line); padding: 24px 0; transition: background-color .3s; }
.learn a:hover { background: var(--hover); }
.learn a:hover .subheading { color: var(--accent-ink); }
.learn .subheading { transition: color .3s; }
.learn .ico { justify-self: end; color: var(--ink-3); }

/* ───────────────────────── Lists: room around the hover ───────────────────────── */
/* List rows keep their lines and hover plates flush with the column, like everything else on the page, and pad
   their content by --row-pad, so a hovered row's typography and arrows never touch the plate's edges. */
.app { --row-pad: 12px; }
@container app (width >= 48rem) { main.page { --row-pad: 16px; } }
.exp-row, .scale-row, .learn a, .show .in, .story li, .chart .crow { padding-inline: var(--row-pad); }
.cbody > .cover { left: calc(var(--label-w) + var(--row-pad)); right: var(--row-pad); }
/* Timeline entries: while the spine is the row's first column (phones, tablets) the whole row is padded and the
   year's marker moves with it; on desktop only the first and last columns are, which keeps the spine on the marker */
.entry { padding-inline: var(--row-pad); }
.level .datum svg { left: calc(10px + var(--row-pad)); }
@container app (width >= 64rem) {
  .entry { padding-inline: 0; }
  .e-date { padding-left: var(--row-pad); }
  .e-meta { padding-right: var(--row-pad); }
  .level .datum svg { left: calc((100% - 9 * var(--grid-gap)) / 20); }
}

/* ═════════════════════════ The two switches ═════════════════════════ */
.app[data-marks="off"] .crop { display: none; }

/* Motion: calm (the headline rises, the timeline bars draw, sections fade in once) or off */
.app[data-motion="calm"] .rise { animation: rise 1.1s var(--settle) both; animation-delay: var(--d, 0ms); }
.app[data-motion="calm"] .fade { animation: fade .8s ease both; animation-delay: var(--d, 0ms); }
.app[data-motion="calm"] [data-reveal] { transition: opacity .7s ease; }
.app[data-motion="calm"] [data-reveal]:not([data-revealed]) { opacity: 0; }
.app[data-motion="calm"] [data-reveal]:not([data-revealed]) .cbar { scale: 0 1; }
.app[data-motion="calm"] .cbar { transition-delay: var(--bd, 0ms); }
.app[data-motion="off"] * { transition-duration: 0s !important; }
.app[data-motion="off"] .group:hover .sheet-frame img { scale: 1; }
.app[data-motion="off"] .group:hover .crop, .app[data-motion="off"] .ico .mv { translate: none !important; }
@keyframes rise { from { translate: 0 110%; } }
@keyframes fade { from { opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .app *, .app *::before, .app *::after { animation: none !important; transition-duration: 0s !important; } .app [data-reveal] { opacity: 1 !important; } }
</style>

  /* ---------- dates (content dates are UTC midnights) ---------- */
  const NOW = new Date();
  const D = (iso) => new Date(iso);
  const LOC = { en: "en-US", pt: "pt-PT" };
  const fmts = {};

  const monthName = (d, tz) => (fmts["m" + S.lang + tz] ??= new Intl.DateTimeFormat(LOC[S.lang], { month: "short", timeZone: tz })).format(d).replace(".", "");

  const yearOf = (iso) => D(iso).getUTCFullYear();
  const monthsOf = (a, b) => { const s = D(a), e = b === null ? NOW : D(b ?? a); return Math.max(1, (e.getUTCFullYear() - s.getUTCFullYear()) * 12 + e.getUTCMonth() - s.getUTCMonth() + 1); };
  const dur = (m) => { const y = Math.floor(m / 12), mo = m % 12, out = []; if (y) out.push(`${y} ${T(y === 1 ? "duration.year" : "duration.years")}`); if (mo || !y) out.push(`${mo} ${T(mo === 1 ? "duration.month" : "duration.months")}`); return out.join(" "); };

  const statusSym = (s) => {
    const box = '<rect x="0.5" y="0.5" width="11" height="11" fill="none" stroke="currentColor"/>';
    const inner = s === "completed" ? '<rect x="0.5" y="0.5" width="11" height="11" fill="currentColor"/>'

    return `<svg viewBox="0 0 12 12" aria-hidden="true">${inner}</svg>`;

  const statusMark = (s) => `<span class="an status ${s === "in progress" ? "running" : ""}">${statusSym(s)}${T("status." + s)}</span>`;
  /* In lists only the exceptions are marked: finished work carries no label */
  const listStatus = (s) => (s === "completed" ? "" : statusMark(s));
  const glyph = (cat, status) => {
    const outline = status === "planned" || status === "in progress";

    return `<svg class="glyph" viewBox="0 0 12 12" aria-hidden="true">${body}</svg>`;

  const crops = '<span class="crop tl"></span><span class="crop tr"></span><span class="crop bl"></span><span class="crop br"></span>';

  const chips = (techs) => `<ul class="chips">${techs.map((x) => `<li class="chip">${esc(x)}</li>`).join("")}</ul>`;

    const ticks = []; spans.forEach((x) => { for (let y = new Date(x.s).getUTCFullYear(); y <= new Date(x.e).getUTCFullYear(); y++) { const t = Date.UTC(y, 0, 1); if (t >= x.s && t <= x.e) ticks.push({ year: y, pos: pos(new Date(t)) }); } });

          <div class="col m-3 l-4 dur fade" style="--d:320ms; align-self:end"><p class="an">${T("record.duration")}</p>${dim(dur(monthsOf(r.dateStart, r.dateEnd)), { open: run, cls: run ? "acc" : "muted", labelCls: run ? "acc" : "ink" })}<p class="an ends"><span>${monthYear(r.dateStart)}</span><span>${run ? T("timeline.present") : monthYear(r.dateEnd)}</span></p></div>

      </header></section>
      <section class="band">
      <section class="wrap"><div class="grid part block p-brief" data-reveal>

      ${showRows.length ? block(T(r.category === "experience" ? "record.products" : "record.highlights"), `<ul class="prods">${showRows.map((s) => { const lbl = s.labelKey ? T(s.labelKey) : s.label, desc = s.descriptionKey ? T(s.descriptionKey) : s.description, ext = s.href && /^https?:/.test(s.href); const inner = `<h3 class="subheading">${esc(lbl)}${s.href ? icon(ext ? "out" : "dl") : ""}</h3>${desc ? `<p>${esc(desc)}</p>` : ""}${stack(s.techs)}`; return `<li>${s.href ? `<a href="${esc(s.href)}" target="_blank" rel="noreferrer">${inner}</a>` : inner}</li>`; }).join("")}</ul>`, true) : ""}

  /* ═════════════ About ═════════════ */
  const about = () => {
    const cur = EXP.find((r) => r.dateEnd === null);
    const cre = PF.experience.find((e) => e.id === "exp-crespassos");
    const soft = oldestFirst(PF.experience.filter((e) => e.id !== "exp-crespassos"));
    const span = (list) => { const s = Math.min(...list.map((x) => yearOf(x.dateStart))), run = list.some((x) => x.dateEnd === null), e = Math.max(...list.map((x) => yearOf(x.dateEnd ?? x.dateStart))); return run ? `${s} – ${T("timeline.present")}` : s === e ? `${s}` : `${s} – ${e}`; };
    const chapters = [["school", [faul], T(faul.summaryKey)], ["practice", [cre], T(cre.summaryKey)], ["transition", [ironhack], T(ironhack.summaryKey)], ["software", soft, T("about.story.software.body")]];
    return `
    <section class="band">${pageHead(T("nav.about"), T("about.title"), T("about.intro"))}
    <section class="wrap grid a-intro">
      <figure class="col s-3 m-3 l-4" data-reveal>${portrait()}</figure>

          <div><dt class="an">${T("about.facts.degree")}</dt><dd>${esc(titleOf(faul))}</dd></div>
          <div><dt class="an">${C("frontendSince")}</dt><dd>${yearOf(ironhack.dateStart)}</dd></div>
        </dl>
      </div>
    </section></section>
    <section class="band"><div class="wrap">
      ${secHead(T("about.story.title"), { action: secLink(T("home.experience.timeline"), "screen:timeline") })}
      <ol class="story sec-body">${chapters.map(([k, items, body]) => `<li class="grid" data-reveal><p class="an col l-3">${span(items)}</p><h3 class="subheading col m-3 l-4">${T(`about.story.${k}.title`)}</h3><div class="col m-5 l-5"><p>${esc(body)}</p><div class="rel">${items.map((it) => `<a class="tl-link" data-go="${goOf(it)}"><span class="lk">${esc(orgOf(it) || titleOf(it))}</span>${icon("right")}</a>`).join("")}</div></div></li>`).join("")}</ol>
    </div></section>
    <section class="band"><div class="wrap">
      ${secHead(T("home.method.title"), { intro: T("home.method.intro") })}
      <ol class="principles sec-body">${Object.entries(PRINCIPLES).map(([k, d]) => `<li class="principle" data-reveal><span class="principle-ico"><svg class="ico" viewBox="0 0 24 24" aria-hidden="true">${d}</svg></span><h3 class="principle-title">${T(`home.method.${k}.title`)}</h3><p>${T(`home.method.${k}.body`)}</p></li>`).join("")}</ol>
    </div></section>
    <section class="band"><div class="wrap">
      ${secHead(T("about.toolbox.title"))}
      <div class="sec-body">
        <ul class="stack-panel">${STACK.main.map((x) => `<li class="stack-cell"${brandStyle(x)} data-reveal><span class="stack-ico"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="${x.d}"/></svg></span><span class="name">${esc(x.name)}</span></li>`).join("")}</ul>
      </div>
    </div></section>
`;
  };

  };
  const brandStyle = (x) => (x.brand ? ` style="--brand:${x.brand}"` : "");
  const SCREEN_FN = { home, projects, project, timeline, about, record };

  /* ═════════════ Render ═════════════ */
  const app = document.getElementById("app"), frame = document.getElementById("frame"), bar = document.getElementById("studyBar");
  let io;
  const observe = () => {
    io?.disconnect();
    io = new IntersectionObserver((es) => es.forEach((e) => { if (e.isIntersecting) { e.target.setAttribute("data-revealed", ""); io.unobserve(e.target); } }), { rootMargin: "0px 0px -6% 0px" });
    app.querySelectorAll("[data-reveal]").forEach((el) => io.observe(el));
  };
  /* Study plumbing: internal links get an href so they can be reached by keyboard; site paths (/CV_TiagoGil.pdf)
     point at the copies in assets/ */
  const linkify = (root) => {
    root.querySelectorAll("a[data-go]:not([href])").forEach((a) => a.setAttribute("href", "#" + a.dataset.go));
    root.querySelectorAll("a[data-scroll]:not([href])").forEach((a) => a.setAttribute("href", "#" + a.dataset.scroll));
    root.querySelectorAll("a[data-top]:not([href])").forEach((a) => a.setAttribute("href", "#top"));
    root.querySelectorAll('a[href^="/"]').forEach((a) => a.setAttribute("href", "assets" + a.getAttribute("href")));
  };
  const toastEl = Object.assign(document.createElement("div"), { className: "study-toast" });
  toastEl.setAttribute("role", "status");
  document.body.appendChild(toastEl);
  let toastTimer;
  const toast = (msg) => { toastEl.textContent = msg; toastEl.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => toastEl.classList.remove("on"), 2400); };
  const save = () => {
    ["frame", "theme", "lang", "screen", "project", "record", "marks", "motion"].forEach((k) => store.set(k, S[k]));
    history.replaceState(null, "", location.pathname + "#" + [S.screen, S.frame, S.menu ? "menu" : ""].filter(Boolean).join("."));
  };
  const setBarHeight = () => document.documentElement.style.setProperty("--sb-h", bar.offsetHeight + "px");
  const render = () => {
    frame.className = "frame" + (S.frame === "mobile" ? " is-mobile" : "");
    Object.assign(app.dataset, { theme: S.theme, marks: S.marks, motion: S.motion });
    app.lang = S.lang;
    app.innerHTML = header() + `<main class="page">${SCREEN_FN[S.screen]()}</main>` + footer() + menu();
    linkify(app);
    document.documentElement.style.setProperty("--app-w", app.offsetWidth + "px");
    observe();
    renderBar();
    setBarHeight();
    save();
  };
  const renderBar = () => {
    bar.querySelectorAll("[data-set]").forEach((b) => b.setAttribute("aria-pressed", String(S[b.dataset.set] === b.dataset.val)));
    document.getElementById("screenSeg").innerHTML = '<span class="sb-lab">Screen</span>' + SCREENS.map(([k, l]) => `<button type="button" data-screen="${k}" aria-pressed="${S.screen === k}">${l}</button>`).join("");
    const ctx = document.getElementById("ctxSeg");
    if (S.screen === "project") { ctx.hidden = false; ctx.innerHTML = '<span class="sb-lab">Scenario</span>' + SCENARIOS.map(([k, l]) => `<button type="button" data-ctx-project="${k}" aria-pressed="${S.project === k}">${l}</button>`).join(""); }
    else if (S.frame === "mobile") { ctx.hidden = false; ctx.innerHTML = `<span class="sb-lab">Menu</span><button type="button" data-ctx-menu aria-pressed="${S.menu}">${S.menu ? "Open" : "Closed"}</button>`; }
    else { ctx.hidden = true; ctx.innerHTML = ""; }
  };
  const go = (target) => {
    const [kind, val] = target.split(":");
    S.menu = false;
    if (kind === "screen") S.screen = val;
    if (kind === "project") { S.screen = "project"; S.project = val; }
    if (kind === "record") { S.screen = "record"; S.record = val; }
    render();
    window.scrollTo({ top: 0 });
  };

  bar.addEventListener("click", (e) => {
    const b = e.target.closest("button"); if (!b) return;
    if (b.dataset.set) { S[b.dataset.set] = b.dataset.val; if (b.dataset.set === "frame" && S.frame === "desktop") S.menu = false; render(); }
    else if (b.dataset.screen) { S.screen = b.dataset.screen; S.menu = false; render(); window.scrollTo({ top: 0 }); }
    else if (b.dataset.ctxProject) { S.project = b.dataset.ctxProject; render(); }
    else if (b.hasAttribute("data-ctx-menu")) { S.menu = !S.menu; render(); }
    else if (b.id === "replay") { window.scrollTo({ top: 0 }); app.innerHTML = ""; requestAnimationFrame(render); }
  });

  app.addEventListener("click", (e) => {
    const a = e.target.closest("[data-go],[data-lang],[data-theme-toggle],[data-menu],[data-ptype],[data-tcat],[data-tsort],[data-tfilters],[data-fclose],[data-fapply],[data-fclear],[data-tchip],[data-scroll],[data-top],.copy-btn,a[href]");
    if (!a) return;
    if (a.dataset.go) { e.preventDefault(); go(a.dataset.go); return; }
    if (a.dataset.lang) { S.lang = a.dataset.lang; render(); return; }
    if (a.hasAttribute("data-theme-toggle")) { S.theme = S.theme === "dark" ? "light" : "dark"; render(); return; }
    if (a.hasAttribute("data-menu")) { S.menu = !S.menu; render(); return; }
    if (a.dataset.ptype) { S.ptype = a.dataset.ptype; render(); return; }
    if (a.dataset.tcat) { S.tcat = a.dataset.tcat; render(); return; }
    if (a.hasAttribute("data-tsort")) { S.tsort = S.tsort === "oldest" ? "newest" : "oldest"; render(); return; }
    if (a.hasAttribute("data-tfilters")) { F = draftFrom(S); refreshModal(); document.getElementById("tlFilters").showModal(); return; }
    if (a.hasAttribute("data-fclose")) { document.getElementById("tlFilters").close(); return; }
    if (a.hasAttribute("data-fapply")) { Object.assign(S, draftFrom(F || S)); F = null; document.getElementById("tlFilters").close(); refreshTimeline(); return; }
    if (a.hasAttribute("data-fclear")) { F = draftFrom({ ttechs: [], ttypes: [], tnow: [] }); refreshModal(); return; }
    if (a.dataset.tchip) { const k = a.dataset.tchip, v = a.dataset.v; F ||= draftFrom(S); F[k] = F[k].includes(v) ? F[k].filter((x) => x !== v) : [...F[k], v]; refreshModal(); return; }
    if (a.dataset.scroll) { e.preventDefault(); document.getElementById(a.dataset.scroll)?.scrollIntoView({ behavior: S.motion === "off" ? "auto" : "smooth" }); return; }
    if (a.hasAttribute("data-top")) { e.preventDefault(); window.scrollTo({ top: 0, behavior: S.motion === "off" ? "auto" : "smooth" }); return; }
    if (a.classList.contains("copy-btn")) {
      navigator.clipboard?.writeText(PF.person.email).catch(() => {});
      a.innerHTML = `${icon("check")}${C("copied")}`;
      setTimeout(() => { if (a.isConnected) a.innerHTML = `${icon("copy")}${T("contact.copy")}`; }, 1800);
      return;
    }
    if (a.getAttribute("href")?.startsWith("mailto:")) { e.preventDefault(); toast("On the live site this opens your email app."); return; }
    if (!a.getAttribute("href")) e.preventDefault();
  });
  app.addEventListener("mousedown", (e) => { if (e.target.id === "tlFilters") e.target.close(); });
  /* ✕, Escape and the backdrop all end in "close": drop the draft (close doesn't bubble, so listen in capture) */
  app.addEventListener("close", (e) => { if (e.target.id === "tlFilters") { F = null; refreshModal(); } }, true);
  app.addEventListener("input", (e) => {
    if (e.target.id !== "tlSearch") return;
    S.tq = e.target.value;
    refreshTimeline();
  });
  window.addEventListener("keydown", (e) => {
    if (e.key !== "/" || e.metaKey || e.ctrlKey) return;
    const input = document.getElementById("tlSearch");
    if (!input || e.target.closest?.("input,textarea")) return;
    e.preventDefault(); input.focus();
  });
  window.addEventListener("resize", setBarHeight);
  window.addEventListener("hashchange", () => { readHash(); render(); window.scrollTo({ top: 0 }); });

  render();
  /* ?filters=open opens the Timeline's filters on load (for sharing and screenshots) */
  if (q.get("filters") === "open") { F = draftFrom(S); document.getElementById("tlFilters")?.showModal(); }
})();
</script>
